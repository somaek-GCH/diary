<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#14181f;
  --ink-2:#1c2230;
  --ink-3:#252c3c;
  --paper:#e9e3d3;
  --paper-dim:#8c8779;
  --brass:#c39a5f;
  --brass-dim:#8a6c3f;
  --moss:#7ea27f;
  --rust:#a56b58;
  --line:#333c4f;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
}
.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:48px 24px 96px;
}
.app-grid{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:32px;
  align-items:start;
}
.sidebar{
  position:sticky;
  top:24px;
  display:flex;
  flex-direction:column;
  gap:20px;
  max-height:calc(100vh - 48px);
  overflow-y:auto;
}
.main-pane{
  min-width:0;
}
@media (max-width:900px){
  .app-grid{grid-template-columns:1fr;}
  .sidebar{position:static;max-height:none;order:2;}
  .main-pane{order:1;}
}
.calendar-widget{
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
}
.cal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.cal-month-label{
  font-family:'Noto Serif KR',serif;
  font-weight:700;
  font-size:15px;
}
.cal-nav-btn{
  background:transparent;
  border:1px solid var(--line);
  color:var(--paper-dim);
  border-radius:6px;
  width:26px;
  height:26px;
  cursor:pointer;
  font-size:14px;
  line-height:1;
}
.cal-nav-btn:hover{color:var(--paper);border-color:var(--paper-dim);}
.cal-weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  font-size:11px;
  color:var(--paper-dim);
  text-align:center;
  margin-bottom:4px;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}
.cal-day{
  position:relative;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  border-radius:8px;
  border:none;
  background:transparent;
  cursor:pointer;
  color:var(--paper);
  font-family:'JetBrains Mono',monospace;
}
.cal-day:hover{background:var(--ink-3);}
.cal-day.outside{color:var(--paper-dim);opacity:0.5;}
.cal-day.is-today{box-shadow:inset 0 0 0 1px var(--brass-dim);}
.cal-day.selected{background:var(--brass);color:var(--ink);font-weight:700;}
.cal-day .dot{
  position:absolute;
  bottom:3px;
  left:50%;
  transform:translateX(-50%);
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--moss);
}
.cal-day.selected .dot{background:var(--ink);}
.header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:36px;
  border-bottom:1px solid var(--line);
  padding-bottom:20px;
}
.header h1{
  font-family:'Noto Serif KR',serif;
  font-weight:700;
  font-size:26px;
  margin:0;
  letter-spacing:-0.5px;
}
.header .date{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  color:var(--paper-dim);
  text-align:right;
}
.nav-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.nav-row input[type="date"]{
  background:var(--ink-2);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:6px;
  padding:6px 10px;
  font-size:12px;
  font-family:'JetBrains Mono',monospace;
}
.nav-today-btn{
  background:transparent;
  border:1px solid var(--line);
  color:var(--paper-dim);
  border-radius:6px;
  padding:6px 12px;
  font-size:12px;
  cursor:pointer;
}
.nav-today-btn:hover{color:var(--paper);border-color:var(--paper-dim);}
.editing-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--paper-dim);
  margin-bottom:10px;
}
.lunar-date{
  font-size:12px;
  color:var(--brass-dim);
  font-family:'JetBrains Mono',monospace;
}
.badge-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0 0;
}
.badge{
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  background:var(--ink-3);
  border:1px solid var(--brass-dim);
  color:var(--brass);
}
.badge.holiday{background:var(--rust);border-color:var(--rust);color:var(--paper);}
.badge.bday{background:var(--moss);border-color:var(--moss);color:var(--ink);}

.family-section{
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:40px;
}
.family-form{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.family-form input, .family-form select{
  background:var(--ink);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:6px;
  padding:7px 10px;
  font-size:12px;
  font-family:'Noto Sans KR',sans-serif;
}
.family-form input[name="fname"]{flex:1;min-width:100px;}
.family-form input[type="number"]{width:56px;}
.family-add-btn{
  background:var(--moss);
  color:var(--ink);
  border:none;
  border-radius:6px;
  padding:7px 14px;
  font-size:12px;
  cursor:pointer;
}
.family-list{display:flex;gap:8px;flex-wrap:wrap;}
.family-chip{
  font-size:12px;
  background:var(--ink-3);
  border:1px solid var(--line);
  border-radius:20px;
  padding:5px 8px 5px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.family-chip button{
  background:none;border:none;color:var(--paper-dim);
  cursor:pointer;font-size:13px;padding:0 2px;
}

.hidden{display:none;}

.lock-overlay{
  position:fixed;
  inset:0;
  background:var(--ink);
  z-index:1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
}
.lock-overlay.hidden{display:none;}
.lock-overlay h2{
  font-family:'Noto Serif KR',serif;
  font-size:22px;
  margin:0;
}
.lock-overlay input{
  background:var(--ink-2);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:8px;
  padding:12px 16px;
  font-size:20px;
  letter-spacing:8px;
  text-align:center;
  width:180px;
  font-family:'JetBrains Mono',monospace;
}
.lock-overlay button{
  background:var(--brass);
  color:var(--ink);
  border:none;
  border-radius:6px;
  padding:10px 24px;
  font-size:13px;
  cursor:pointer;
}
.lock-overlay .lock-msg{
  font-size:12px;
  color:var(--rust);
  min-height:16px;
}

.drive-section{
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:24px;
}
.drive-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:8px;
}
.drive-row input{
  flex:1;
  min-width:200px;
  background:var(--ink);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:6px;
  padding:8px 10px;
  font-size:12px;
  font-family:'JetBrains Mono',monospace;
}
.drive-connect-btn{
  background:var(--brass);
  color:var(--ink);
  border:none;
  border-radius:6px;
  padding:8px 16px;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
}
.drive-status{
  font-size:12px;
  color:var(--paper-dim);
  font-family:'JetBrains Mono',monospace;
}
.drive-status.connected{color:var(--moss);}
.hint{
  font-size:11px;
  color:var(--paper-dim);
  margin-top:4px;
}
.hint kbd{
  background:var(--ink-3);
  border:1px solid var(--line);
  border-radius:4px;
  padding:1px 6px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
}

.mood-row{
  display:flex;
  gap:6px;
  margin-bottom:14px;
}
.mood-btn{
  background:var(--ink-3);
  border:1px solid var(--line);
  border-radius:8px;
  font-size:20px;
  width:40px;
  height:40px;
  cursor:pointer;
  opacity:.5;
}
.mood-btn.selected{
  opacity:1;
  border-color:var(--brass);
  background:var(--ink-2);
}
.entry-row .mood{margin-right:6px;}

.entry-card{
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:24px;
  margin-bottom:40px;
  background-image:repeating-linear-gradient(
    var(--ink-2) 0px, var(--ink-2) 31px, var(--line) 32px
  );
  background-position: 0 62px;
}
.entry-card .prompts{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
.prompt-tag{
  font-size:11px;
  color:var(--ink);
  background:var(--brass);
  padding:4px 10px;
  border-radius:20px;
  cursor:pointer;
  border:none;
  font-family:'Noto Sans KR',sans-serif;
}
.prompt-tag.moss{background:var(--moss);}
.prompt-tag.rust{background:var(--rust);}
textarea#editor{
  width:100%;
  min-height:180px;
  background:transparent;
  border:none;
  color:var(--paper);
  font-family:'Noto Sans KR',sans-serif;
  font-size:15px;
  line-height:32px;
  resize:vertical;
  outline:none;
}
textarea#editor::placeholder{color:var(--paper-dim);}
.photo-strip{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0 4px;
}
.photo-thumb{
  position:relative;
  width:64px;
  height:64px;
  border-radius:6px;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--ink-3);
}
.photo-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.photo-thumb .rm{
  position:absolute;
  top:2px;
  right:2px;
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  border-radius:50%;
  width:18px;
  height:18px;
  font-size:11px;
  line-height:1;
  cursor:pointer;
}
.photo-add-btn{
  width:64px;
  height:64px;
  border-radius:6px;
  border:1px dashed var(--line);
  background:none;
  color:var(--paper-dim);
  font-size:20px;
  cursor:pointer;
}
.photo-icon{
  font-size:10px;
  color:var(--brass-dim);
  margin-left:6px;
}
.entry-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  border-top:1px solid var(--line);
  padding-top:14px;
  gap:12px;
}
.weather-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--brass);
  border:1px solid var(--brass-dim);
  border-radius:20px;
  padding:3px 10px;
  white-space:nowrap;
}
.weather-tag.loading{color:var(--paper-dim);border-color:var(--line);}
.entry-row .d .w{color:var(--brass-dim);margin-left:8px;}
.byte-count{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--paper-dim);
}
.save-btn{
  background:var(--brass);
  color:var(--ink);
  border:none;
  padding:9px 20px;
  border-radius:6px;
  font-weight:500;
  font-size:13px;
  cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.save-btn:hover{background:#d4ab70;}
.save-msg{
  font-size:12px;
  color:var(--moss);
  opacity:0;
  transition:opacity .3s;
}
.save-msg.show{opacity:1;}

.section-title{
  font-family:'Noto Serif KR',serif;
  font-size:17px;
  margin:0 0 4px;
}
.section-sub{
  font-size:12px;
  color:var(--paper-dim);
  margin:0 0 18px;
}

.sameday-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:44px;
}
.sameday-card{
  flex:0 0 200px;
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px;
}
.sameday-card .year{
  font-family:'JetBrains Mono',monospace;
  color:var(--brass);
  font-size:13px;
  margin-bottom:8px;
}
.sameday-card .txt{
  font-size:13px;
  color:var(--paper-dim);
  line-height:1.6;
  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.sameday-empty{
  flex:0 0 200px;
  border:1px dashed var(--line);
  border-radius:8px;
  padding:16px;
  font-size:12px;
  color:var(--paper-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.search-row{margin-bottom:24px;}
#search{
  width:100%;
  background:var(--ink-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px 14px;
  color:var(--paper);
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;
  outline:none;
}
#search::placeholder{color:var(--paper-dim);}

.year-group{margin-bottom:28px;}
.year-label{
  font-family:'JetBrains Mono',monospace;
  color:var(--brass-dim);
  font-size:13px;
  margin-bottom:10px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.entry-row{
  padding:12px 0;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.entry-row:last-child{border-bottom:none;}
.entry-row .d{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--paper-dim);
  margin-bottom:4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.entry-row .del-btn{
  margin-left:6px;
  background:none;
  border:1px solid var(--line);
  color:var(--paper-dim);
  border-radius:4px;
  font-size:10px;
  padding:1px 7px;
  cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
}
.entry-row .del-btn:hover{color:var(--rust);border-color:var(--rust);}
.entry-row .p{
  font-size:14px;
  color:var(--paper);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.entry-row .full{
  display:none;
  font-size:13.5px;
  color:var(--paper-dim);
  line-height:1.7;
  white-space:pre-wrap;
  margin-top:8px;
}
.entry-row.open .full{display:block;}
.entry-row.open .p{white-space:normal;}

.stats-bar{
  display:flex;
  gap:20px;
  margin:36px 0 44px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--paper-dim);
}
.stats-bar b{color:var(--paper);}
</style>
</head>
<body>
<div class="lock-overlay hidden" id="lock-overlay">
  <h2>기록장</h2>
  <input type="password" id="lock-pin-input" inputmode="numeric" maxlength="8" placeholder="••••">
  <button id="lock-unlock-btn">잠금 해제</button>
  <div class="lock-msg" id="lock-msg"></div>
</div>
<div class="wrap" id="app-wrap">

  <div class="header">
    <div>
      <h1>기록장</h1>
      <div class="hint">키보드로 바로 쓰고 <kbd>Cmd/Ctrl</kbd>+<kbd>Enter</kbd>로 저장</div>
    </div>
    <div class="date" id="today-date"></div>
  </div>

  <div class="nav-row">
    <input type="date" id="view-date-input">
    <button class="nav-today-btn" id="nav-today-btn">오늘로</button>
    <span class="lunar-date" id="lunar-date"></span>
    <button class="nav-today-btn" id="family-toggle-btn" style="margin-left:auto;">기념일 관리</button>
    <button class="nav-today-btn" id="drive-toggle-btn">동기화</button>
    <button class="nav-today-btn" id="lock-setup-btn">잠금 설정</button>
  </div>
  <div class="badge-row" id="badge-row"></div>

  <div class="family-section hidden" id="family-section">
    <div class="section-title" style="margin-bottom:12px;">가족 생일</div>
    <div class="family-form">
      <input type="text" name="fname" id="f-name" placeholder="이름">
      <select id="f-cal">
        <option value="solar">양력</option>
        <option value="lunar">음력</option>
      </select>
      <input type="number" id="f-month" placeholder="월" min="1" max="12">
      <input type="number" id="f-day" placeholder="일" min="1" max="30">
      <button class="family-add-btn" id="f-add">추가</button>
    </div>
    <div class="family-list" id="family-list"></div>
  </div>

  <div class="drive-section hidden" id="drive-section">
    <div class="section-title" style="margin-bottom:12px;">Google Drive 동기화</div>
    <div id="drive-inputs-wrap">
      <div class="drive-row">
        <input type="text" id="gclient-id" placeholder="Google OAuth 클라이언트 ID를 붙여넣으세요">
      </div>
      <div class="drive-row">
        <input type="text" id="gaccount-hint" placeholder="동기화할 Google 계정 이메일 (예: me@gmail.com)">
        <button class="drive-connect-btn" id="gconnect">Google 계정 연결</button>
      </div>
    </div>
    <div class="drive-row hidden" id="drive-connected-controls">
      <button class="nav-today-btn" id="gdrive-reload">다시 불러오기</button>
      <button class="nav-today-btn" id="gdrive-reset">연결 해제</button>
    </div>
    <div class="drive-status" id="gstatus">연결 안 됨 · 기록은 지금 이 브라우저에만 있어요</div>
  </div>

  <div class="app-grid">
    <aside class="sidebar">
      <div class="calendar-widget" id="calendar-widget">
        <div class="cal-header">
          <button type="button" class="cal-nav-btn" id="cal-prev-btn" aria-label="이전 달">‹</button>
          <div class="cal-month-label" id="cal-month-label"></div>
          <button type="button" class="cal-nav-btn" id="cal-next-btn" aria-label="다음 달">›</button>
        </div>
        <div class="cal-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div>
        <div class="section-title">전체 기록</div>
        <div class="section-sub">검색하거나 눌러서 펼쳐보세요</div>
        <div class="search-row">
          <input id="search" placeholder="키워드로 검색... (예: 산책, 프로젝트)">
        </div>
        <div id="timeline"></div>
      </div>
    </aside>

    <main class="main-pane">
      <div class="entry-card">
        <div class="editing-label" id="editing-label"></div>
        <div class="mood-row" id="mood-row">
          <button class="mood-btn" data-mood="😊" title="좋음">😊</button>
          <button class="mood-btn" data-mood="🙂" title="괜찮음">🙂</button>
          <button class="mood-btn" data-mood="😐" title="보통">😐</button>
          <button class="mood-btn" data-mood="🙁" title="별로">🙁</button>
          <button class="mood-btn" data-mood="😢" title="힘듦">😢</button>
        </div>
        <div class="prompts">
          <button class="prompt-tag moss" data-t="오늘 잘한 것: ">오늘 잘한 것</button>
          <button class="prompt-tag rust" data-t="아쉬운 것: ">아쉬운 것</button>
          <button class="prompt-tag" data-t="내일의 다짐: ">내일의 다짐</button>
        </div>
        <textarea id="editor" placeholder="오늘 하루는 어땠나요..."></textarea>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none;">

function fmtDate(d){
  const dt = new Date(d);
  return dt.getFullYear()+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getDate()).padStart(2,'0');
}
function mmdd(d){
  const dt = new Date(d);
  return String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function byteLen(str){
  return new TextEncoder().encode(str).length;
}
function dateKey(d){
  const dt = new Date(d);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

// ── 잠금 (PIN)
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  const info = lunarInfoFor(d);

  if(!info){ lunarEl.textContent=''; return; }
  lunarEl.textContent = '음력 '+info.lMonth+'월 '+info.lDay+'일'+(info.isLeap?' (윤달)':'');
}

function renderBadges(d){
  const row = document.getElementById('badge-row');
  row.innerHTML = '';
  const info = lunarInfoFor(d);
  if(!info) return;

  if(info.isTerm && info.Term){
    const b = document.createElement('span');
    b.className='badge';
    b.textContent = TERM_KO[info.Term] || info.Term;
    row.appendChild(b);
  }
  if(info.lMonth===1 && info.lDay===1){
    const b=document.createElement('span'); b.className='badge holiday'; b.textContent='설날'; row.appendChild(b);
  }
  if(info.lMonth===8 && info.lDay===15){
    const b=document.createElement('span'); b.className='badge holiday'; b.textContent='추석'; row.appendChild(b);
  }
  family.forEach(f=>{
    let match = false;
    if(f.calType==='solar'){
      match = (d.getMonth()+1===f.month && d.getDate()===f.day);
    } else {
      match = (info.lMonth===f.month && info.lDay===f.day);
    }
    if(match){
      const b=document.createElement('span'); b.className='badge bday'; b.textContent=f.name+' 생일'; row.appendChild(b);
    }
  });
}

    localStorage.setItem('diary_account_hint', accountHint);
  }catch(e){}

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/drive.file',
    login_hint: accountHint || undefined,
    callback: async (resp)=>{
      if(resp.error){ setDriveStatus('연결 실패: '+resp.error); return; }
      accessToken = resp.access_token;
      setDriveStatus('폴더 준비 중...');

}

async function ensureDriveFolder(){
  const q = "mimeType='application/vnd.google-apps.folder' and name='기록장-데이터' and trashed=false";
  const res = await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q), {
    headers: {Authorization: 'Bearer '+accessToken}
  });
  const data = await res.json();
  if(data.files && data.files.length>0){
    driveFolderId = data.files[0].id;
  } else {
    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST',
      headers: {Authorization:'Bearer '+accessToken, 'Content-Type':'application/json'},
      body: JSON.stringify({name:'기록장-데이터', mimeType:'application/vnd.google-apps.folder'})
    });
    const created = await createRes.json();
    driveFolderId = created.id;
  }
}

function entryToMarkdown(entry){
  let fm = '---\ndate: '+dateKey(entry.date)+'\n';
  if(entry.weather) fm += 'weather: '+entry.weather+'\n';
  if(entry.mood) fm += 'mood: '+entry.mood+'\n';
  const photoIds = (entry.photos||[]).filter(p=>p.driveFileId).map(p=>p.driveFileId);
  if(photoIds.length) fm += 'photos: '+photoIds.join(',')+'\n';
  fm += '---\n';
  return fm + entry.content;
}

function parseMarkdownEntry(text, filename, fileId, modifiedTime){
  const fallbackKey = filename.replace(/\.md$/,''); // frontmatter의 date가 깨졌을 때 되돌아갈 값
  let dkey = fallbackKey;
  let weather = null;
  let mood = null;
  let photos = [];
  let content = text;
  const fmMatch = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if(fmMatch){
    const fm = fmMatch[1];
    const dateM = fm.match(/date:\s*(.+)/);
    const weatherM = fm.match(/weather:\s*(.+)/);
    const moodM = fm.match(/mood:\s*(.+)/);
    const photosM = fm.match(/photos:\s*(.+)/);
    if(dateM) dkey = dateM[1].trim();
    if(weatherM) weather = weatherM[1].trim();
    if(moodM) mood = moodM[1].trim();
    if(photosM) photos = photosM[1].trim().split(',').filter(Boolean).map(id=>({driveFileId:id}));
    content = fmMatch[2];
  }
  let d = new Date(dkey+'T00:00:00');
  if(isNaN(d)){
    d = new Date(fallbackKey+'T00:00:00'); // frontmatter의 date만 깨진 경우 파일명 날짜로 복구
  }
  if(isNaN(d)) return null; // 파일명 날짜조차 유효하지 않을 때만 최종 포기
  return {date: d.toISOString(), content: content.trim(), weather, mood, photos, driveFileId: fileId, driveModifiedTime: modifiedTime || null};
}

async function loadAllFromDrive(){
  const q = "'"+driveFolderId+"' in parents and trashed=false";
  const res = await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name,modifiedTime)&pageSize=1000', {
    headers:{Authorization:'Bearer '+accessToken}
  });
  const data = await res.json();
  const loaded = [];
  for(const f of (data.files||[])){
    const contentRes = await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media', {
      headers:{Authorization:'Bearer '+accessToken}
    });
    const text = await contentRes.text();
    const parsed = parseMarkdownEntry(text, f.name, f.id, f.modifiedTime);
    if(parsed) loaded.push(parsed);
  }
  if(loaded.length){
    entries = loaded;
    entries.sort((a,b)=>new Date(b.date)-new Date(a.date));
    renderStats();
    renderTimeline(document.getElementById('search').value);
    renderSameDay();
    renderMonthCalendar();
  }
}

async function saveEntryToDrive(entry){
  if(!accessToken || !driveFolderId) return; // 연결 전이면 로컬(브라우저 메모리)에만 저장됨
  const filename = dateKey(entry.date)+'.md';
  const content = entryToMarkdown(entry);
  setDriveStatus('동기화 중...', true);

  if(entry.driveFileId){
    // 다른 기기(PC/모바일)가 먼저 저장했는지 확인 — 마지막 저장이 덮어쓰는 것을 방지
    if(entry.driveModifiedTime){
      try{
        const metaRes = await fetch('https://www.googleapis.com/drive/v3/files/'+entry.driveFileId+'?fields=modifiedTime', {
          headers:{Authorization:'Bearer '+accessToken}
        });
        const meta = await metaRes.json();
        if(meta.modifiedTime && meta.modifiedTime !== entry.driveModifiedTime){
          const overwrite = confirm(
            fmtDate(entry.date)+' 기록이 다른 기기에서 먼저 저장되었습니다.\n'+
            '지금 저장하면 그 내용을 덮어씁니다. 계속할까요?\n'+
            '(취소하면 저장하지 않고, "다시 불러오기"로 최신 내용을 확인하세요.)'
          );
          if(!overwrite){
            setDriveStatus('저장 취소됨 · 다른 기기의 변경사항이 있습니다', true);
            throw new Error('SAVE_CANCELLED_CONFLICT');
          }
        }
      }catch(e){
        if(e.message === 'SAVE_CANCELLED_CONFLICT') throw e;
        // 메타데이터 조회 실패(네트워크 등)는 충돌 확인을 건너뛰고 저장을 계속 진행
      }
    }
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/'+entry.driveFileId+'?uploadType=media&fields=modifiedTime', {
      method:'PATCH',
      headers:{Authorization:'Bearer '+accessToken, 'Content-Type':'text/markdown'},
      body: content
    });
    const updated = await res.json();
    if(updated.modifiedTime) entry.driveModifiedTime = updated.modifiedTime;
  } else {
    const boundary = 'diary-boundary-'+Date.now();
    const metadata = {name: filename, parents:[driveFolderId]};
    const body =
      '--'+boundary+'\r\n'+
      'Content-Type: application/json; charset=UTF-8\r\n\r\n'+
      JSON.stringify(metadata)+'\r\n'+
      '--'+boundary+'\r\n'+
      'Content-Type: text/markdown\r\n\r\n'+
      content+'\r\n'+
      '--'+boundary+'--';
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
      method:'POST',
      headers:{Authorization:'Bearer '+accessToken, 'Content-Type':'multipart/related; boundary='+boundary},
      body
    });
    const created = await res.json();
    entry.driveFileId = created.id;
    if(created.modifiedTime) entry.driveModifiedTime = created.modifiedTime;
  }
  setDriveStatus('Google Drive 연결됨 · 방금 동기화됨', true);
}

let pendingPhotoFiles = []; // 아직 저장 안 한, 새로 고른 사진 파일들

async function uploadPhotoToDrive(file){
  const boundary = 'diary-photo-'+Date.now()+Math.random().toString(36).slice(2);
  const metadata = {name: dateKey(viewDate)+'-'+file.name, parents:[driveFolderId]};
  const metadataPart = '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n';
  const contentTypePart = '--'+boundary+'\r\nContent-Type: '+(file.type||'image/jpeg')+'\r\n\r\n';
  const closeDelim = '\r\n--'+boundary+'--';
  const body = new Blob([metadataPart, contentTypePart, file, closeDelim]);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST',
    headers:{Authorization:'Bearer '+accessToken, 'Content-Type':'multipart/related; boundary='+boundary},
    body
  });
  const data = await res.json();
  return data.id;
}

async function resolvePhotoUrl(photo){
  if(photo.url) return photo.url;
  if(photo.dataUrl){ photo.url = photo.dataUrl; return photo.url; }
  if(photo.driveFileId && accessToken){
    try{
      const res = await fetch('https://www.googleapis.com/drive/v3/files/'+photo.driveFileId+'?alt=media', {
        headers:{Authorization:'Bearer '+accessToken}
      });
      const blob = await res.blob();
      photo.url = URL.createObjectURL(blob);
      return photo.url;
    }catch(e){ return null; }
  }
  return null;
}

async function renderPhotoStrip(){
  const strip = document.getElementById('photo-strip');
  strip.querySelectorAll('.photo-thumb').forEach(el=>el.remove());
  const existing = findEntry(viewDate);
  const savedPhotos = (existing && existing.photos) || [];

  for(const p of savedPhotos){
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    thumb.innerHTML = '<button class="rm">×</button>';
    strip.insertBefore(thumb, document.getElementById('photo-add-btn'));
    resolvePhotoUrl(p).then(url=>{
      if(url){ const img=document.createElement('img'); img.src=url; thumb.prepend(img); }
    });
    thumb.querySelector('.rm').addEventListener('click', async ()=>{
      if(p.driveFileId && accessToken){
        try{
          await fetch('https://www.googleapis.com/drive/v3/files/'+p.driveFileId, {
            method:'PATCH',
            headers:{Authorization:'Bearer '+accessToken, 'Content-Type':'application/json'},
            body: JSON.stringify({trashed:true})
          });
        }catch(e){}
      }
      const idx = existing.photos.indexOf(p);
      if(idx>-1) existing.photos.splice(idx,1);
      saveEntryToDrive(existing);
      renderPhotoStrip();
    });
  }

  pendingPhotoFiles.forEach((file, idx)=>{
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    thumb.appendChild(img);
    const rm = document.createElement('button');
    rm.className='rm'; rm.textContent='×';
    rm.addEventListener('click', ()=>{
      pendingPhotoFiles.splice(idx,1);
      renderPhotoStrip();
    });
    thumb.appendChild(rm);
    strip.insertBefore(thumb, document.getElementById('photo-add-btn'));
  });
}

document.getElementById('photo-add-btn').addEventListener('click', ()=>{
  document.getElementById('photo-input').click();
});
document.getElementById('photo-input').addEventListener('change', (e)=>{
  pendingPhotoFiles.push(...Array.from(e.target.files));
  e.target.value = '';
  renderPhotoStrip();
});

// 실제 사용 시에는 Drive에 저장된 기록이 여기로 불러와진다.
let entries = [];
entries.sort((a,b)=>new Date(b.date)-new Date(a.date));
renderMonthCalendar();

// ── 날씨: 하루에 한 번만 API를 호출하고, 이후엔 캐시된 값을 재사용한다.
const weatherCache = {}; // { '2026-07-25': '맑음 18°C' }

function weatherCodeToText(code, temp){
  const map = {
    0:'맑음', 1:'대체로 맑음', 2:'구름 조금', 3:'흐림',
    45:'안개', 48:'서리 안개',
    51:'약한 이슬비', 53:'이슬비', 55:'강한 이슬비',
    61:'약한 비', 63:'비', 65:'강한 비',
    71:'약한 눈', 73:'눈', 75:'강한 눈',
    80:'소나기', 95:'뇌우'
  };
  const label = map[code] || '알 수 없음';
  return label+' '+Math.round(temp)+'°C';
}

function fetchWeatherForToday(){
  const key = dateKey(today);
  const tag = document.getElementById('weather-tag');
  if(dateKey(viewDate) !== key) return; // 오늘을 보고 있을 때만 호출

  if(weatherCache[key]){
    tag.textContent = weatherCache[key];
    tag.classList.remove('loading');
    return;
  }
  if(!navigator.geolocation){
    tag.textContent = '위치 정보를 사용할 수 없음';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos)=>{
      try{
        const {latitude, longitude} = pos.coords;
        const res = await fetch(
          'https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current_weather=true'
        );
        const data = await res.json();
        const text = weatherCodeToText(data.current_weather.weathercode, data.current_weather.temperature);
        weatherCache[key] = text;
        if(dateKey(viewDate)===key){ tag.textContent = text; tag.classList.remove('loading'); }
      }catch(err){
        tag.textContent = '날씨를 불러오지 못함';
        tag.classList.remove('loading');
      }
    },
    ()=>{
      tag.textContent = '위치 권한이 필요함';
      tag.classList.remove('loading');
    }
  );
}

function findEntry(d){
  const key = dateKey(d);
  return entries.find(e => dateKey(e.date) === key);
}

// 날짜 이동으로 선택된 날의 기록을 편집창에 불러온다.
function loadEntryForViewDate(){
  const editor = document.getElementById('editor');
  const existing = findEntry(viewDate);
  editor.value = existing ? existing.content : '';
  updateByteCount();
  setMoodUI(existing ? existing.mood : null);

  const isToday = dateKey(viewDate) === dateKey(today);
  const label = document.getElementById('editing-label');
  label.textContent = fmtDate(viewDate) + (isToday ? ' · 오늘' : '') + (existing ? ' 기록 편집 중' : ' 새 기록 작성');
  document.getElementById('delete-entry-btn').style.display = existing ? '' : 'none';

  const tag = document.getElementById('weather-tag');
  if(existing && existing.weather){
    tag.textContent = existing.weather;
    tag.classList.remove('loading');
  } else if(isToday){
    tag.classList.add('loading');
    tag.textContent = '날씨 확인 중...';
    fetchWeatherForToday();
  } else {
    tag.textContent = '날씨 기록 없음';
    tag.classList.remove('loading');
  }

  renderLunarHeader(viewDate);
  renderBadges(viewDate);
  renderSameDay();
  renderMonthCalendar();
  pendingPhotoFiles = [];
  renderPhotoStrip();
}

document.getElementById('view-date-input').addEventListener('change',(e)=>{
  if(!e.target.value) return;
  const [y,m,dd] = e.target.value.split('-').map(Number);
  viewDate = new Date(y, m-1, dd);
  calMonth = new Date(y, m-1, 1);
  loadEntryForViewDate();
});
document.getElementById('nav-today-btn').addEventListener('click',()=>{
  viewDate = new Date(today);
  calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  document.getElementById('view-date-input').value = dateKey(viewDate);
  loadEntryForViewDate();
});

// ── 사이드바 월별 캘린더: 기록이 있는 날짜에 점을 표시하고, 클릭하면 해당 날짜로 이동한다.
function renderMonthCalendar(){
  const grid = document.getElementById('cal-grid');
  const label = document.getElementById('cal-month-label');
  if(!grid || !label) return;

  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  label.textContent = year+'년 '+(month+1)+'월';

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
  const startOffset = 1 - firstWeekday;
  const todayKey = dateKey(today);
  const selectedKey = dateKey(viewDate);

  let html = '';
  for(let i=0; i<totalCells; i++){
    const cellDate = new Date(year, month, startOffset + i);
    const key = dateKey(cellDate);
    const outside = cellDate.getMonth() !== month;
    const hasEntry = !!findEntry(cellDate);
    const classes = ['cal-day'];
    if(outside) classes.push('outside');
    if(key === todayKey) classes.push('is-today');
    if(key === selectedKey) classes.push('selected');
    html += '<button type="button" class="'+classes.join(' ')+'" data-date="'+key+'">'
          + cellDate.getDate()
          + (hasEntry ? '<span class="dot"></span>' : '')
          + '</button>';
  }
  grid.innerHTML = html;
}

document.getElementById('cal-grid').addEventListener('click', (e)=>{
  const btn = e.target.closest('.cal-day');
  if(!btn) return;
  const [y,m,d] = btn.dataset.date.split('-').map(Number);
  viewDate = new Date(y, m-1, d);
  calMonth = new Date(y, m-1, 1);
  document.getElementById('view-date-input').value = dateKey(viewDate);
  loadEntryForViewDate();
});
document.getElementById('cal-prev-btn').addEventListener('click', ()=>{
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1);
  renderMonthCalendar();
});
document.getElementById('cal-next-btn').addEventListener('click', ()=>{
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
  renderMonthCalendar();
});

function renderSameDay(){
  const row = document.getElementById('sameday-row');
  row.innerHTML='';
  const viewMMDD = mmdd(viewDate);
  const matches = entries.filter(e => mmdd(e.date)===viewMMDD && dateKey(e.date)!==dateKey(viewDate));
  if(matches.length===0){
    row.innerHTML = '<div class="sameday-empty">아직 이 날짜의<br>과거 기록이 없어요</div>';
    return;
  }
  matches.forEach(e=>{
    const y = new Date(e.date).getFullYear();
    const div = document.createElement('div');
    div.className='sameday-card';
    div.innerHTML = '<div class="year">'+y+'년</div><div class="txt"></div>';
    div.querySelector('.txt').textContent = e.content;
    row.appendChild(div);
  });
}

function renderStats(){
  const bar = document.getElementById('stats-bar');
  const totalBytes = entries.reduce((s,e)=>s+byteLen(e.content),0);
  const years = new Set(entries.map(e=>new Date(e.date).getFullYear())).size;
  bar.innerHTML =
    '<span><b>'+entries.length+'</b>개의 기록</span>'+
    '<span><b>'+years+'</b>개 연도</span>'+
    '<span>총 <b>'+(totalBytes/1024).toFixed(1)+' KB</b></span>';
}

function renderTimeline(filter){
  const timeline = document.getElementById('timeline');
  timeline.innerHTML='';
  const f = (filter||'').trim().toLowerCase();
  const filtered = entries.filter(e=>!f || e.content.toLowerCase().includes(f));

  const byYear = {};
  filtered.forEach(e=>{
    const y = new Date(e.date).getFullYear();
    (byYear[y] = byYear[y]||[]).push(e);
  });

  Object.keys(byYear).sort((a,b)=>b-a).forEach(y=>{
    const group = document.createElement('div');
    group.className='year-group';
    const label = document.createElement('div');
    label.className='year-label';
    label.textContent = y+'년 · '+byYear[y].length+'개';
    group.appendChild(label);

    byYear[y].forEach(e=>{
      const row = document.createElement('div');
      row.className='entry-row';
      const firstLine = e.content.split('\n')[0];
      row.innerHTML =
        '<div class="d"><span></span><span><button class="del-btn edit-btn-inline" title="수정">수정</button><button class="del-btn" title="삭제">삭제</button></span></div>'+
        '<div class="p"></div>'+
        '<div class="full"></div>';
      row.querySelector('.d span').textContent = (e.mood ? e.mood+' ' : '')+fmtDate(e.date)+(e.weather ? ' · '+e.weather : '');
      row.querySelector('.p').textContent = firstLine;
      row.querySelector('.full').textContent = e.content;
      row.addEventListener('click',(evt)=>{
        if(evt.target.classList.contains('del-btn')) return;
        row.classList.toggle('open');
      });
      row.querySelector('.del-btn:not(.edit-btn-inline)').addEventListener('click',(evt)=>{
        evt.stopPropagation();
        deleteEntry(e);
      });
      function jumpToEdit(){
        viewDate = new Date(e.date);
        document.getElementById('view-date-input').value = dateKey(viewDate);
        loadEntryForViewDate();
        window.scrollTo({top:0, behavior:'smooth'});
      }
      row.querySelector('.edit-btn-inline').addEventListener('click',(evt)=>{
        evt.stopPropagation();
        jumpToEdit();
      });
      // 더블클릭해도 동일하게 편집 화면으로 이동
      row.addEventListener('dblclick', jumpToEdit);
      group.appendChild(row);
    });
    timeline.appendChild(group);
  });

  if(filtered.length===0){
    timeline.innerHTML = '<div class="section-sub" style="margin-top:12px;">일치하는 기록이 없어요.</div>';
  }
}

document.getElementById('search').addEventListener('input',(e)=>{
  renderTimeline(e.target.value);
});

document.querySelectorAll('.prompt-tag').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const editor = document.getElementById('editor');
    editor.value += (editor.value && !editor.value.endsWith('\n') ? '\n' : '') + btn.dataset.t;
    editor.focus();
    updateByteCount();
  });
});

function updateByteCount(){
  const editor = document.getElementById('editor');
  document.getElementById('byte-count').textContent = byteLen(editor.value)+' bytes';
}
document.getElementById('editor').addEventListener('input', updateByteCount);

async function deleteEntry(entry){
  const ok = confirm(fmtDate(entry.date)+' 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.');
  if(!ok) return;

  const idx = entries.indexOf(entry);
  if(idx > -1) entries.splice(idx, 1);

  if(entry.driveFileId && accessToken){
    try{
      await fetch('https://www.googleapis.com/drive/v3/files/'+entry.driveFileId, {
        method:'PATCH',
        headers:{Authorization:'Bearer '+accessToken, 'Content-Type':'application/json'},
        body: JSON.stringify({trashed:true})
      });
    }catch(e){}
  }

  renderStats();
  renderTimeline(document.getElementById('search').value);
  renderSameDay();
  if(dateKey(viewDate) === dateKey(entry.date)){
    loadEntryForViewDate();
  }
}

document.getElementById('delete-entry-btn').addEventListener('click', ()=>{
  const existing = findEntry(viewDate);
  if(!existing){ return; }
  deleteEntry(existing);
});

async function saveEntry(){
  const saveBtn = document.getElementById('save-btn');
  if(saveBtn.disabled) return; // 저장 진행 중이면 연타 무시
  const editor = document.getElementById('editor');
  if(!editor.value.trim()) return;

  saveBtn.disabled = true;

  const existing = findEntry(viewDate);
  const weather = (existing && existing.weather) || weatherCache[dateKey(viewDate)] || null;
  let target;

  if(existing){
    existing.content = editor.value;
    existing.weather = weather;
    existing.mood = selectedMood;
    target = existing;
  } else {
    target = {date: viewDate.toISOString(), content: editor.value, weather, mood: selectedMood, photos: []};
    entries.unshift(target);
  }
  if(!target.photos) target.photos = [];
  entries.sort((a,b)=>new Date(b.date)-new Date(a.date));

  // 새로 첨부한 사진 처리: 연결되어 있으면 Drive에 업로드, 아니면 이 브라우저 세션에만 보관
  for(const file of pendingPhotoFiles){
    if(accessToken && driveFolderId){
      try{
        const id = await uploadPhotoToDrive(file);
        target.photos.push({driveFileId:id});
      }catch(e){}
    } else {
      const dataUrl = await new Promise(res=>{
        const reader = new FileReader();
        reader.onload = ()=>res(reader.result);
        reader.readAsDataURL(file);
      });
      target.photos.push({dataUrl});
    }
  }
  pendingPhotoFiles = [];

  try{
    await saveEntryToDrive(target); // Drive 저장이 끝날 때까지 기다린 뒤에야 버튼이 다시 눌린다
  }catch(e){
    saveBtn.disabled = false;
    if(e.message === 'SAVE_CANCELLED_CONFLICT') return; // 충돌 확인 취소 — 성공 메시지 없이 종료
    throw e;
  }
  saveBtn.disabled = false;

  updateByteCount();
  renderSameDay();
  renderStats();
  renderTimeline(document.getElementById('search').value);
  loadEntryForViewDate();
  const msg = document.getElementById('save-msg');
  msg.classList.add('show');
  setTimeout(()=>msg.classList.remove('show'),1500);
}

document.getElementById('save-btn').addEventListener('click', saveEntry);
document.getElementById('editor').addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
    e.preventDefault();
    saveEntry();
  }
});

renderStats();
renderTimeline('');
loadEntryForViewDate();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
